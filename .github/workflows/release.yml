name: Release to prod

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Auto-bump patch version
        run: |
          git fetch --tags
          CURRENT=$(node -p "require('./package.json').version")
          MAJOR_MINOR="${CURRENT%.*}"
          LAST_TAG=$(git tag --list "v${MAJOR_MINOR}.*" --sort=-version:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            PATCH=1
          else
            LAST_PATCH="${LAST_TAG##*.}"
            PATCH=$((LAST_PATCH + 1))
          fi
          VERSION="${MAJOR_MINOR}.${PATCH}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          git tag "v${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
          echo "Build version: ${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm release
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}

      - name: Push docs to prod branch
        run: |
          touch docs/.nojekyll
          DEPLOY_DIR=$(mktemp -d)
          mv docs "$DEPLOY_DIR/docs"
          cd "$DEPLOY_DIR"
          git init
          git checkout -b prod
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          VERSION=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          git commit -m "release: v${VERSION} (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
